[package]
name = "rust_lib_vela"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
log = "0.4"
rand = "0.10"
iroh = "1.4.2"
n0-future = "0.3.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "fs", "time", "macros", "net"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27"
unicode-normalization = "0.1"
cap-std = "4.0"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
