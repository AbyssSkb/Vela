name: Capture native Vela menu
on:
  push:
    branches: [codex/qa-native-menu-screenshot]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Compare AppKit drag destinations on the hosted desktop
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cat > DropProbe.swift <<'SWIFT'
          import AppKit

          final class DropView: NSView {
            override func hitTest(_ point: NSPoint) -> NSView? { self }
            override func draggingEntered(_ sender: NSDraggingInfo) -> NSDragOperation {
              NSLog("VIEW_ENTER types=%@ mask=%lu", "\(sender.draggingPasteboard.types ?? [])",
                    sender.draggingSourceOperationMask.rawValue)
              return .copy
            }
            override func draggingUpdated(_ sender: NSDraggingInfo) -> NSDragOperation { .copy }
            override func performDragOperation(_ sender: NSDraggingInfo) -> Bool {
              NSLog("VIEW_DROP"); return true
            }
          }

          final class App: NSObject, NSApplicationDelegate, NSWindowDelegate, NSDraggingDestination {
            var items: [NSStatusItem] = []
            var reference: NSWindow?
            let types: [NSPasteboard.PasteboardType] = [.fileURL, .init("NSFilenamesPboardType")]
            func applicationDidFinishLaunching(_ notification: Notification) {
              for tag in ["View", "Window"] {
                let item = NSStatusBar.system.statusItem(withLength: 70)
                items.append(item)
                let button = item.button!
                button.title = tag
                button.setAccessibilityLabel(tag)
                if tag == "View" {
                  let view = DropView(frame: button.bounds)
                  view.autoresizingMask = [.width, .height]
                  button.addSubview(view)
                  view.registerForDraggedTypes(types)
                } else {
                  button.window?.delegate = self
                  button.window?.registerForDraggedTypes(types)
                }
              }
              let frame = NSRect(x: 16, y: NSScreen.main!.frame.height - 160, width: 230, height: 90)
              let win = NSWindow(contentRect: frame, styleMask: [.titled], backing: .buffered, defer: false)
              win.title = "Drop reference"
              win.delegate = self
              win.level = .floating
              win.registerForDraggedTypes(types)
              win.orderFrontRegardless()
              reference = win
              NSLog("PROBE_READY")
            }
            func draggingEntered(_ sender: NSDraggingInfo) -> NSDragOperation {
              NSLog("WINDOW_ENTER name=%@ types=%@ mask=%lu", sender.draggingDestinationWindow?.title ?? "",
                    "\(sender.draggingPasteboard.types ?? [])", sender.draggingSourceOperationMask.rawValue)
              return .copy
            }
            func draggingUpdated(_ sender: NSDraggingInfo) -> NSDragOperation { .copy }
            func performDragOperation(_ sender: NSDraggingInfo) -> Bool {
              NSLog("WINDOW_DROP name=%@", sender.draggingDestinationWindow?.title ?? "")
              return true
            }
          }

          let app = NSApplication.shared
          let delegate = App()
          app.setActivationPolicy(.accessory)
          app.delegate = delegate
          app.run()
          SWIFT
          cat > Drag.swift <<'SWIFT'
          import AppKit
          import ApplicationServices

          func value(_ node: AXUIElement, _ key: String) -> CFTypeRef? {
            var data: CFTypeRef?
            AXUIElementCopyAttributeValue(node, key as CFString, &data)
            return data
          }
          func frame(_ node: AXUIElement) -> CGRect? {
            guard let position = value(node, "AXPosition") as! AXValue?,
                  let size = value(node, "AXSize") as! AXValue? else { return nil }
            var origin = CGPoint.zero
            var extent = CGSize.zero
            guard AXValueGetValue(position, .cgPoint, &origin), AXValueGetValue(size, .cgSize, &extent)
            else { return nil }
            return CGRect(origin: origin, size: extent)
          }
          func findFile(_ node: AXUIElement, depth: Int = 0) -> CGRect? {
            guard depth <= 12 else { return nil }
            let role = value(node, "AXRole") as? String ?? ""
            let name = ["AXTitle", "AXDescription", "AXValue"].compactMap { value(node, $0) as? String }
            if name.contains(where: { $0.contains("Vela drag fixture") }), let rect = frame(node) {
              print("Finder file: \(role) \(name) \(rect)")
              return rect
            }
            for key in ["AXSelectedChildren", "AXChildren"] {
              for child in value(node, key) as? [AXUIElement] ?? [] {
                if let rect = findFile(child, depth: depth + 1) { return rect }
              }
            }
            return nil
          }
          func mouse(_ type: CGEventType, _ location: CGPoint) {
            let source = CGEventSource(stateID: .hidSystemState)
            let event = CGEvent(mouseEventSource: source, mouseType: type, mouseCursorPosition: location, mouseButton: .left)
            event?.setIntegerValueField(.mouseEventClickState, value: 1)
            event?.post(tap: .cghidEventTap)
          }
          let pid = pid_t(CommandLine.arguments[1])!
          let url = URL(fileURLWithPath: CommandLine.arguments[2])
          let app = AXUIElementCreateApplication(pid)
          let finder = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.finder").first!
          let finderAX = AXUIElementCreateApplication(finder.processIdentifier)
          print("CGEvent access \(CGPreflightPostEventAccess())")
          for target in ["View", "Window", "Drop reference"] {
            NSWorkspace.shared.activateFileViewerSelecting([url])
            finder.activate()
            Thread.sleep(forTimeInterval: 0.8)
            guard let window = value(finderAX, "AXFocusedWindow"), let source = findFile(window as! AXUIElement)
            else { print("No Finder icon"); exit(1) }
            let elements = target == "Drop reference" ? value(app, "AXWindows") :
              value(value(app, "AXExtrasMenuBar") as! AXUIElement, "AXChildren")
            let item = (elements as? [AXUIElement])?.first { node in
              ["AXTitle", "AXDescription", "AXHelp"].contains { value(node, $0) as? String == target }
            }
            guard let item, let dest = frame(item) else { print("No target \(target)"); exit(1) }
            let from = CGPoint(x: source.midX, y: source.midY)
            let to = CGPoint(x: dest.midX, y: dest.midY)
            print("Drag \(from) -> \(target) \(to) frontmost=\(NSWorkspace.shared.frontmostApplication?.localizedName ?? "")")
            mouse(.mouseMoved, from)
            Thread.sleep(forTimeInterval: 0.1)
            mouse(.leftMouseDown, from)
            Thread.sleep(forTimeInterval: 0.2)
            for step in 1...24 {
              let p = CGFloat(step) / 24
              mouse(.leftMouseDragged, CGPoint(x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p))
              Thread.sleep(forTimeInterval: 0.04)
            }
            Thread.sleep(forTimeInterval: 0.5)
            mouse(.leftMouseUp, to)
            Thread.sleep(forTimeInterval: 0.3)
          }
          SWIFT
          xcrun swiftc DropProbe.swift -o DropProbe
          xcrun swiftc Drag.swift -o Drag
          ./DropProbe > probe.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat probe.log' EXIT
          for i in {1..15}; do
            if grep -q PROBE_READY probe.log; then break; fi
            sleep 1
          done
          mkdir "$RUNNER_TEMP/drag-fixture"
          printf 'Vela drag fixture\n' > "$RUNNER_TEMP/drag-fixture/Vela drag fixture.txt"
          ./Drag "$pid" "$RUNNER_TEMP/drag-fixture/Vela drag fixture.txt"
