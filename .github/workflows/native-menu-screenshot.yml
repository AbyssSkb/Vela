name: Capture native Vela menu

on:
  push:
    branches: [codex/qa-native-menu-screenshot]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        variant: [source]
    steps:
      - name: Download the exact menu fix build
        if: matrix.variant != 'source'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result=$(gh run view 44911065416 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          test "$result" = 74f4976ccc40f61c8aa8963b44adce006b99d2da
          mkdir -p "$RUNNER_TEMP/vela-menu"
          for attempt in {1..120}; do
            if gh run download 44911065416 --repo "$GITHUB_REPOSITORY" --name preview-macos-arm64 --dir "$RUNNER_TEMP/vela-menu"; then break; fi
            sleep 10
          done
          cd "$RUNNER_TEMP/vela-menu"
          archive=(Vela-*-macos-arm64.zip)
          ditto -x -k "${archive[0]}" .

      - name: Compile the exact AppKit sources with a Flutter interface stub
        if: matrix.variant == 'source'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vela-menu/Vela.app/Contents/MacOS"
          cd "$RUNNER_TEMP/vela-menu"
          ref=74f4976ccc40f61c8aa8963b44adce006b99d2da
          for file in AppDelegate.swift MenuFileDropPanel.swift; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/macos/Runner/$file?ref=$ref" |
              sed '/^import FlutterMacOS$/d; /^@main$/d; /UNUserNotificationCenter.current().delegate = self/d' > "$file"
          done
          cat > Dependencies.swift <<'SWIFT'
          import AppKit
          class FlutterAppDelegate: NSObject, NSApplicationDelegate {
            func applicationDidFinishLaunching(_ notification: Notification) {}
            func application(_ application: NSApplication, open urls: [URL]) {}
            func applicationShouldHandleReopen(_ sender: NSApplication, hasVisibleWindows: Bool) -> Bool { true }
            func applicationShouldTerminate(_ sender: NSApplication) -> NSApplication.TerminateReply { .terminateNow }
            func applicationShouldTerminateAfterLastWindowClosed(_ sender: NSApplication) -> Bool { true }
            func applicationSupportsSecureRestorableState(_ app: NSApplication) -> Bool { true }
          }
          struct FlutterStandardTypedData { let bytes: Data }
          class MainFlutterWindow: NSWindow {
            func hideWindow() {}
            func notifyVisible() {}
            func shareAvailable() {}
            func openReceiveFolder() throws -> Bool { false }
            func prepareToTerminate(_ finish: () -> Void) { finish() }
            func sendMenuFiles(_ files: [[String: Any]], to peer: String, _ done: (String?) -> Void) { print("FINDER_SEND_TO=\(peer) COUNT=\(files.count) PATH=\(files.compactMap { $0["path"] as? String }.joined(separator: ","))"); fflush(stdout); done(nil) }
          }
          SWIFT
          cat > main.swift <<'SWIFT'
          import Cocoa

          let app = NSApplication.shared
          app.setActivationPolicy(.accessory)
          let window = MainFlutterWindow(contentRect: NSRect(x: 0, y: 0, width: 500, height: 400),
                                         styleMask: [.titled], backing: .buffered, defer: false)
          window.isReleasedWhenClosed = false
          let delegate = AppDelegate()
          app.delegate = delegate
          delegate.setMenuLanguage("zh")
          delegate.setNodeStatus("ready")
          delegate.setMenuDevices([
            ["id": "phone", "name": "工作手机", "presence": "reachable", "label": "可连接"],
            ["id": "tablet", "name": "平板", "presence": "unavailable", "label": "暂时无法连接"],
          ])
          print("event=offline")
          fflush(stdout)
          app.run()
          SWIFT
          xcrun swiftc AppDelegate.swift MenuFileDropPanel.swift Dependencies.swift main.swift -o Vela.app/Contents/MacOS/Vela
          cat > Vela.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.example.vela.drop-probe</string>
            <key>CFBundleExecutable</key><string>Vela</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - Vela.app
      - name: Capture the AppKit status menu in the test desktop
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          sw_vers -productVersion
          cd "$RUNNER_TEMP/vela-menu"
          cat > capture.swift <<'SWIFT'
          import AppKit
          import ApplicationServices

          let pid = pid_t(CommandLine.arguments[1])!
          func windows() -> [[String: Any]] {
            CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)
              as? [[String: Any]] ?? []
          }
          func frame(_ item: [String: Any]) -> CGRect? {
            guard let bounds = item[kCGWindowBounds as String] as? [String: Any] else { return nil }
            return CGRect(dictionaryRepresentation: bounds as CFDictionary)
          }
          func number(_ item: [String: Any]) -> Int { item[kCGWindowNumber as String] as? Int ?? 0 }
          func element(_ node: AXUIElement, _ key: String) -> CFTypeRef? {
            var value: CFTypeRef?
            AXUIElementCopyAttributeValue(node, key as CFString, &value)
            return value
          }
          func point(_ node: AXUIElement) -> CGPoint? {
            guard let position = element(node, "AXPosition") as! AXValue?,
                  let size = element(node, "AXSize") as! AXValue? else { return nil }
            var origin = CGPoint.zero
            var extent = CGSize.zero
            guard AXValueGetValue(position, .cgPoint, &origin),
                  AXValueGetValue(size, .cgSize, &extent) else { return nil }
            return CGPoint(x: origin.x + extent.width / 2, y: origin.y + extent.height / 2)
          }
          func findFile(_ node: AXUIElement, name term: String = "Vela drag fixture", depth: Int = 0) -> CGPoint? {
            guard depth <= 12 else { return nil }
            for key in ["AXTitle", "AXDescription", "AXValue"] {
              if let name = element(node, key) as? String, name.contains(term) {
                if let location = point(node) { return location }
              }
            }
            for key in ["AXSelectedChildren", "AXChildren"] {
              for child in element(node, key) as? [AXUIElement] ?? [] {
                if let location = findFile(child, name: term, depth: depth + 1) { return location }
              }
            }
            return nil
          }
          func mouse(_ type: CGEventType, _ location: CGPoint) {
            let source = CGEventSource(stateID: .hidSystemState)
            let event = CGEvent(mouseEventSource: source, mouseType: type, mouseCursorPosition: location, mouseButton: .left)
            event?.setIntegerValueField(.mouseEventClickState, value: 1)
            event?.post(tap: .cghidEventTap)
          }
          func findPanel(excluding ids: Set<Int>) -> [String: Any]? {
            for _ in 0..<25 {
              if let panel = windows().first(where: {
                guard !ids.contains(number($0)), let rect = frame($0), rect.minY < 120,
                      (100...600).contains(rect.width), (35...560).contains(rect.height)
                else { return false }
                return ($0[kCGWindowOwnerPID as String] as? pid_t) == pid
                  || ($0[kCGWindowLayer as String] as? Int ?? 0) >= 25
              }) { return panel }
              Thread.sleep(forTimeInterval: 0.1)
            }
            return nil
          }
          func capture(_ panel: [String: Any], _ name: String, pointer: CGPoint) throws {
            let rect = frame(panel)!
            let left = max(0, min(rect.minX, pointer.x) - 15)
            let right = min(CGDisplayBounds(CGMainDisplayID()).maxX, max(rect.maxX, pointer.x + 95) + 15)
            let crop = CGRect(x: left, y: 0, width: right - left, height: rect.maxY + 22).integral
            let pixels = "\(Int(crop.minX)),0,\(Int(crop.width)),\(Int(crop.height))"
            let capture = Process()
            capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            capture.arguments = ["-x", "-R", pixels, name]
            try capture.run()
            capture.waitUntilExit()
            precondition(capture.terminationStatus == 0)
          }

          let finder = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.finder").first!
          let url = URL(fileURLWithPath: CommandLine.arguments[2])
          NSWorkspace.shared.activateFileViewerSelecting([url])
          finder.activate()
          Thread.sleep(forTimeInterval: 0.8)
          let finderAX = AXUIElementCreateApplication(finder.processIdentifier)
          let velaAX = AXUIElementCreateApplication(pid)
          var source: CGPoint?
          var target: CGPoint?
          for _ in 0..<40 {
            if let window = element(finderAX, "AXFocusedWindow") {
              source = findFile(window as! AXUIElement)
            }
            if let extras = element(velaAX, "AXExtrasMenuBar"),
              let button = (element(extras as! AXUIElement, "AXChildren") as? [AXUIElement])?.first {
              target = point(button)
            }
            if source != nil && target != nil { break }
            Thread.sleep(forTimeInterval: 0.15)
          }
          guard let source, let target, CGPreflightPostEventAccess() else {
            print("Finder source: \(String(describing: source)), Vela target: \(String(describing: target)), CGEvent permission: \(CGPreflightPostEventAccess())")
            exit(1)
          }
          func fullCapture(_ name: String) throws {
            let capture = Process()
            capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            capture.arguments = ["-x", name]
            try capture.run()
            capture.waitUntilExit()
            precondition(capture.terminationStatus == 0)
          }
          func findDrop(height: CGFloat, timeout: TimeInterval = 2) -> [String: Any]? {
            let end = Date(timeIntervalSinceNow: timeout)
            repeat {
              if let panel = windows().first(where: {
                guard ($0[kCGWindowOwnerPID as String] as? pid_t) == pid, let rect = frame($0) else { return false }
                let widthMatches = height == 36 ? (100...180).contains(rect.width) : abs(rect.width - 280) < 2
                return abs(rect.height - height) < 2 && widthMatches && rect.minY < 100
              }) { return panel }
              Thread.sleep(forTimeInterval: 0.06)
            } while Date() < end
            return nil
          }

          func key(_ code: CGKeyCode) {
            let pointer = CGEventSource(stateID: .hidSystemState)
            for down in [true, false] {
              CGEvent(keyboardEventSource: pointer, virtualKey: code, keyDown: down)?.post(tap: .cghidEventTap)
            }
          }

          func glide(to point: CGPoint) {
            let start = CGEvent(source: nil)!.location
            for step in 1...18 {
              let fraction = CGFloat(step) / 18
              mouse(.leftMouseDragged, CGPoint(x: start.x + (point.x - start.x) * fraction,
                                               y: start.y + (point.y - start.y) * fraction))
              Thread.sleep(forTimeInterval: 0.045)
            }
          }

          let waypoint = CGPoint(x: target.x - 320, y: 350)
          func waitForApp(_ id: String) {
            for _ in 0..<36 {
              if NSWorkspace.shared.frontmostApplication?.bundleIdentifier == id { return }
              Thread.sleep(forTimeInterval: 0.12)
            }
            fatalError("Could not switch to \(id)")
          }

          func click(_ point: CGPoint) {
            mouse(.mouseMoved, point)
            mouse(.leftMouseDown, point)
            Thread.sleep(forTimeInterval: 0.14)
            mouse(.leftMouseUp, point)
            Thread.sleep(forTimeInterval: 0.32)
          }

          func startDrag(_ name: String) -> CGPoint {
            guard let focused = element(finderAX, "AXFocusedWindow"),
                  let source = findFile(focused as! AXUIElement, name: name) else {
              fatalError("Could not locate \(name) in Finder")
            }
            mouse(.mouseMoved, source)
            Thread.sleep(forTimeInterval: 0.12)
            mouse(.leftMouseDown, source)
            Thread.sleep(forTimeInterval: 0.18)
            let inFinder = CGPoint(x: source.x + 43, y: source.y + 21)
            mouse(.leftMouseDragged, inFinder)
            Thread.sleep(forTimeInterval: 0.35)
            return inFinder
          }

          func drop(_ name: String, using panel: [String: Any]? = nil, capturePrompt: Bool = false) throws -> [String: Any] {
            let inFinder = startDrag(name)
            guard let targetPanel = panel ?? findDrop(height: 36) else {
              mouse(.leftMouseUp, inFinder)
              throw NSError(domain: "Finder test did not show the initial hint", code: 1)
            }
            let rect = frame(targetPanel)!
            precondition(!rect.contains(inFinder))
            if capturePrompt { try capture(targetPanel, "vela-finder-hint.png", pointer: target) }
            let point = CGPoint(x: rect.minX + 14, y: rect.minY + 13)
            glide(to: CGPoint(x: point.x - 100, y: point.y + 95))
            glide(to: point)
            precondition(findDrop(height: panel == nil ? 36 : 110).flatMap(frame) == rect,
                         "Hover changed the drop panel frame")
            if capturePrompt { try capture(targetPanel, "vela-finder-highlight.png", pointer: target) }
            mouse(.leftMouseUp, point)
            guard let chooser = findDrop(height: 110) else {
              try? fullCapture("vela-finder-missing-chooser.png")
              fatalError("Dropping the file did not display devices")
            }
            precondition(number(chooser) == number(targetPanel))
            Thread.sleep(forTimeInterval: 0.35)
            return chooser
          }

          waitForApp("com.apple.finder")
          let first = try drop("Vela drag fixture", capturePrompt: true)
          let calculator = Process()
          calculator.executableURL = URL(fileURLWithPath: "/usr/bin/open")
          calculator.arguments = ["-a", "Calculator"]
          try calculator.run()
          calculator.waitUntilExit()
          for _ in 0..<30 {
            if let alternate = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.calculator").first,
               let surface = windows().first(where: {
                 guard ($0[kCGWindowOwnerPID as String] as? pid_t) == alternate.processIdentifier,
                       let rect = frame($0) else { return false }
                 return rect.width > 120 && rect.height > 140
               }), let rect = frame(surface) {
              click(CGPoint(x: rect.midX, y: rect.minY + 14))
              break
            }
            Thread.sleep(forTimeInterval: 0.12)
          }
          waitForApp("com.apple.calculator")
          precondition(findDrop(height: 110).map(number) == number(first), "Switching apps dismissed the batch")
          try fullCapture("vela-finder-panel-while-calculator-front.png")

          NSWorkspace.shared.activateFileViewerSelecting([url])
          guard let finderWindow = windows().first(where: {
            guard ($0[kCGWindowOwnerPID as String] as? pid_t) == finder.processIdentifier,
                  let rect = frame($0) else { return false }
            return rect.width > 480 && rect.height > 240
          }), let finderRect = frame(finderWindow) else {
            fatalError("The hosted Finder window was unavailable")
          }
          click(CGPoint(x: finderRect.maxX - 36, y: finderRect.minY + 150))
          waitForApp("com.apple.finder")
          click(waypoint)
          precondition(findDrop(height: 110).map(number) == number(first), "Clicking Finder dismissed the batch")
          let combined = try drop("Vela second fixture", using: first)
          try capture(combined, "vela-finder-two-files.png", pointer: target)
          let rect = frame(combined)!
          click(CGPoint(x: rect.midX, y: rect.minY + 51))
          precondition(findDrop(height: 110, timeout: 0.25) == nil, "Selecting a device did not close the batch")
          waitForApp("com.apple.finder")

          let toClose = try drop("Vela drag fixture")
          let closeRect = frame(toClose)!
          click(CGPoint(x: closeRect.maxX - 22, y: closeRect.minY + 21))
          precondition(findDrop(height: 110, timeout: 0.25) == nil, "Close should dismiss the batch")
          let newBatch = try drop("Vela second fixture")
          let newRect = frame(newBatch)!
          click(CGPoint(x: newRect.midX, y: newRect.minY + 51))
          precondition(findDrop(height: 110, timeout: 0.25) == nil)
          print("FINDER_PERSIST_APPEND_CLOSE_SEND_OK")
          SWIFT
          defaults write -g AppleInterfaceStyleSwitchesAutomatically -bool false
          if [[ "$VARIANT" == dark ]]; then
            defaults write -g AppleInterfaceStyle -string Dark
          else
            defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          fi
          defaults write -g AppleLanguages -array zh-Hans en
          support="$HOME/Library/Containers/com.example.vela/Data/Library/Application Support/com.example.vela"
          mkdir -p "$support"
          sqlite3 "$support/peer_state_v2.sqlite3" <<'SQL'
          CREATE TABLE peer_state (profile TEXT PRIMARY KEY, value TEXT NOT NULL);
          PRAGMA user_version = 1;
          INSERT INTO peer_state (profile, value) VALUES ('default', '{"version":2,"peers":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"Phone","3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"Tablet"},"types":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"mobile","3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"tablet"},"aliases":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"工作手机","3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"平板"}}');
          SQL
          "$PWD/Vela.app/Contents/MacOS/Vela" > vela.log 2>&1 &
          vela_pid=$!
          trap 'kill "$vela_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'event=offline' vela.log; then break; fi
            kill -0 "$vela_pid"
            sleep 1
          done
          grep -E 'event=ready|event=offline' vela.log
          kill -0 "$vela_pid"
          fixture="$RUNNER_TEMP/finder-fixture"
          mkdir "$fixture"
          printf 'Test file for Vela\n' > "$fixture/Vela drag fixture.txt"
          printf 'Second file for Vela\n' > "$fixture/Vela second fixture.txt"
          xcrun swift capture.swift "$vela_pid" "$fixture/Vela drag fixture.txt"
          test -s vela-finder-hint.png && test -s vela-finder-highlight.png && test -s vela-finder-two-files.png
          if [[ "$VARIANT" == source ]]; then
            grep 'FINDER_SEND_TO=phone COUNT=2 PATH=.*Vela drag fixture.txt,.*Vela second fixture.txt' vela.log
            grep 'FINDER_SEND_TO=phone COUNT=1 PATH=.*Vela second fixture.txt' vela.log
            test "$(grep -c 'FINDER_SEND_TO=' vela.log)" = 2
          fi
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vela-finder-drop-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/vela-menu/vela-*.png
            ${{ runner.temp }}/vela-menu/*.log
          if-no-files-found: warn
          retention-days: 3
