name: Capture native Vela menu

on:
  push:
    branches: [codex/qa-native-menu-screenshot]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 28
    steps:
      - name: Download the exact menu fix build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result=$(gh run view 44903556375 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          test "$result" = 64d854289c1d6ad5fcbd74201b18919632e7d5d7
          mkdir -p "$RUNNER_TEMP/vela-menu"
          for attempt in {1..120}; do
            if gh run download 44903556375 --repo "$GITHUB_REPOSITORY" --name preview-macos-arm64 --dir "$RUNNER_TEMP/vela-menu"; then break; fi
            sleep 10
          done
          cd "$RUNNER_TEMP/vela-menu"
          archive=(Vela-*-macos-arm64.zip)
          ditto -x -k "${archive[0]}" .
      - name: Capture the AppKit status menu in the test desktop
        run: |
          set -euo pipefail
          sw_vers -productVersion
          cd "$RUNNER_TEMP/vela-menu"
          cat > capture.swift <<'SWIFT'
          import AppKit
          import ApplicationServices

          let pid = pid_t(CommandLine.arguments[1])!
          func windows() -> [[String: Any]] {
            CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)
              as? [[String: Any]] ?? []
          }
          func frame(_ item: [String: Any]) -> CGRect? {
            guard let bounds = item[kCGWindowBounds as String] as? [String: Any] else { return nil }
            return CGRect(dictionaryRepresentation: bounds as CFDictionary)
          }
          func number(_ item: [String: Any]) -> Int { item[kCGWindowNumber as String] as? Int ?? 0 }
          func element(_ node: AXUIElement, _ key: String) -> CFTypeRef? {
            var value: CFTypeRef?
            AXUIElementCopyAttributeValue(node, key as CFString, &value)
            return value
          }
          func point(_ node: AXUIElement) -> CGPoint? {
            guard let position = element(node, "AXPosition") as! AXValue?,
                  let size = element(node, "AXSize") as! AXValue? else { return nil }
            var origin = CGPoint.zero
            var extent = CGSize.zero
            guard AXValueGetValue(position, .cgPoint, &origin),
                  AXValueGetValue(size, .cgSize, &extent) else { return nil }
            return CGPoint(x: origin.x + extent.width / 2, y: origin.y + extent.height / 2)
          }
          func findFile(_ node: AXUIElement, depth: Int = 0) -> CGPoint? {
            guard depth <= 12 else { return nil }
            for key in ["AXTitle", "AXDescription", "AXValue"] {
              if let name = element(node, key) as? String, name.contains("Vela drag fixture") {
                if let location = point(node) { return location }
              }
            }
            for key in ["AXSelectedChildren", "AXChildren"] {
              for child in element(node, key) as? [AXUIElement] ?? [] {
                if let location = findFile(child, depth: depth + 1) { return location }
              }
            }
            return nil
          }
          func mouse(_ type: CGEventType, _ location: CGPoint) {
            let source = CGEventSource(stateID: .hidSystemState)
            let event = CGEvent(mouseEventSource: source, mouseType: type, mouseCursorPosition: location, mouseButton: .left)
            event?.setIntegerValueField(.mouseEventClickState, value: 1)
            event?.post(tap: .cghidEventTap)
          }
          func findPanel(excluding ids: Set<Int>) -> [String: Any]? {
            for _ in 0..<25 {
              if let panel = windows().first(where: {
                guard !ids.contains(number($0)), let rect = frame($0), rect.minY < 120,
                      (100...600).contains(rect.width), (35...560).contains(rect.height)
                else { return false }
                return ($0[kCGWindowOwnerPID as String] as? pid_t) == pid
                  || ($0[kCGWindowLayer as String] as? Int ?? 0) >= 25
              }) { return panel }
              Thread.sleep(forTimeInterval: 0.1)
            }
            return nil
          }
          func capture(_ panel: [String: Any], _ name: String, pointer: CGPoint) throws {
            let rect = frame(panel)!
            let left = max(0, min(rect.minX, pointer.x) - 15)
            let right = min(CGDisplayBounds(CGMainDisplayID()).maxX, max(rect.maxX, pointer.x + 95) + 15)
            let crop = CGRect(x: left, y: 0, width: right - left, height: rect.maxY + 22).integral
            let pixels = "\(Int(crop.minX)),0,\(Int(crop.width)),\(Int(crop.height))"
            let capture = Process()
            capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            capture.arguments = ["-x", "-R", pixels, name]
            try capture.run()
            capture.waitUntilExit()
            precondition(capture.terminationStatus == 0)
          }

          let finder = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.finder").first!
          let url = URL(fileURLWithPath: CommandLine.arguments[2])
          NSWorkspace.shared.activateFileViewerSelecting([url])
          finder.activate()
          Thread.sleep(forTimeInterval: 0.8)
          let finderAX = AXUIElementCreateApplication(finder.processIdentifier)
          let velaAX = AXUIElementCreateApplication(pid)
          var source: CGPoint?
          var target: CGPoint?
          for _ in 0..<40 {
            if let window = element(finderAX, "AXFocusedWindow") {
              source = findFile(window as! AXUIElement)
            }
            if let extras = element(velaAX, "AXExtrasMenuBar"),
              let button = (element(extras as! AXUIElement, "AXChildren") as? [AXUIElement])?.first {
              target = point(button)
            }
            if source != nil && target != nil { break }
            Thread.sleep(forTimeInterval: 0.15)
          }
          guard let source, let target, CGPreflightPostEventAccess() else {
            print("Finder source: \(String(describing: source)), Vela target: \(String(describing: target)), CGEvent permission: \(CGPreflightPostEventAccess())")
            exit(1)
          }
          func fullCapture(_ name: String) throws {
            let capture = Process()
            capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            capture.arguments = ["-x", name]
            try capture.run()
            capture.waitUntilExit()
            precondition(capture.terminationStatus == 0)
          }
          try fullCapture("vela-stage-0-idle.png")
          let before = Set(windows().map(number))
          mouse(.mouseMoved, source)
          Thread.sleep(forTimeInterval: 0.1)
          mouse(.leftMouseDown, source)
          Thread.sleep(forTimeInterval: 0.2)
          let beforeTarget = CGPoint(x: target.x, y: target.y + 96)
          mouse(.leftMouseDragged, beforeTarget)
          Thread.sleep(forTimeInterval: 0.35)
          try fullCapture("vela-stage-1-dragging.png")
          print("Drag source: \(source), waypoint: \(beforeTarget), Vela status target: \(target)")
          for step in 1...24 {
            let fraction = CGFloat(step) / 24
            mouse(.leftMouseDragged, CGPoint(x: source.x + (target.x - source.x) * fraction,
                                             y: source.y + (target.y - source.y) * fraction))
            Thread.sleep(forTimeInterval: 0.04)
          }
          guard let hover = findPanel(excluding: before) else {
            mouse(.leftMouseUp, target)
            print("Missing Finder drag preview from \(source) to \(target)")
            let screenshot = Process()
            screenshot.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            screenshot.arguments = ["-x", "vela-drag-debug.png"]
            try screenshot.run()
            screenshot.waitUntilExit()
            exit(1)
          }
          let hoverRect = frame(hover)!
          precondition(hoverRect.maxX < target.x - 8 || hoverRect.minX > target.x + 88,
                       "Finder badge crosses the preview")
          try fullCapture("vela-stage-2-hover.png")
          try capture(hover, "vela-finder-hover.png", pointer: target)
          mouse(.leftMouseUp, target)
          guard let menu = findPanel(excluding: before.union([number(hover)])) else {
            print("Missing Vela recipient menu after Finder drop")
            exit(1)
          }
          try fullCapture("vela-stage-3-dropped.png")
          try capture(menu, "vela-finder-drop.png", pointer: target)
          print("FINDER_HOVER_AND_DROP_OK")
          SWIFT
          defaults write -g AppleInterfaceStyleSwitchesAutomatically -bool false
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          defaults write -g AppleLanguages -array zh-Hans en
          support="$HOME/Library/Containers/com.example.vela/Data/Library/Application Support/com.example.vela"
          mkdir -p "$support"
          sqlite3 "$support/peer_state_v2.sqlite3" <<'SQL'
          CREATE TABLE peer_state (profile TEXT PRIMARY KEY, value TEXT NOT NULL);
          PRAGMA user_version = 1;
          INSERT INTO peer_state (profile, value) VALUES ('default', '{"version":2,"peers":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"Phone","3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"Tablet"},"types":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"mobile","3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"tablet"},"aliases":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"工作手机","3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"平板"}}');
          SQL
          "$PWD/Vela.app/Contents/MacOS/Vela" > vela.log 2>&1 &
          vela_pid=$!
          trap 'kill "$vela_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'event=offline' vela.log; then break; fi
            kill -0 "$vela_pid"
            sleep 1
          done
          grep -E 'event=ready|event=offline' vela.log
          kill -0 "$vela_pid"
          fixture="$RUNNER_TEMP/finder-fixture"
          mkdir "$fixture"
          printf 'Test file for Vela\n' > "$fixture/Vela drag fixture.txt"
          xcrun swift capture.swift "$vela_pid" "$fixture/Vela drag fixture.txt"
          test -s vela-finder-hover.png && test -s vela-finder-drop.png
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vela-finder-drop
          path: |
            ${{ runner.temp }}/vela-menu/vela-*.png
            ${{ runner.temp }}/vela-menu/*.log
          if-no-files-found: warn
          retention-days: 3
