name: Capture native Vela menu

on:
  push:
    branches: [codex/qa-native-menu-screenshot]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - name: Download the exact menu fix build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result=$(gh run view 44896378993 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          test "$result" = 1a03adab99d8d79cf5c11a9c76edc365e292070e
          mkdir -p "$RUNNER_TEMP/vela-menu"
          for attempt in {1..60}; do
            if gh run download 44896378993 --repo "$GITHUB_REPOSITORY" --name preview-macos-arm64 --dir "$RUNNER_TEMP/vela-menu"; then break; fi
            sleep 10
          done
          cd "$RUNNER_TEMP/vela-menu"
          archive=(Vela-*-macos-arm64.zip)
          ditto -x -k "${archive[0]}" .
      - name: Capture the AppKit status menu in the test desktop
        run: |
          set -euo pipefail
          sw_vers -productVersion
          cd "$RUNNER_TEMP/vela-menu"
          cat > capture.swift <<'SWIFT'
          import AppKit
          import ApplicationServices

          let pid = pid_t(CommandLine.arguments[1])!
          let receiver = pid_t(CommandLine.arguments[3])!
          func windows() -> [[String: Any]] {
            CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)
              as? [[String: Any]] ?? []
          }
          func frame(_ item: [String: Any]) -> CGRect? {
            guard let bounds = item[kCGWindowBounds as String] as? [String: Any] else { return nil }
            return CGRect(dictionaryRepresentation: bounds as CFDictionary)
          }
          func number(_ item: [String: Any]) -> Int { item[kCGWindowNumber as String] as? Int ?? 0 }
          func element(_ node: AXUIElement, _ key: String) -> CFTypeRef? {
            var value: CFTypeRef?
            AXUIElementCopyAttributeValue(node, key as CFString, &value)
            return value
          }
          func point(_ node: AXUIElement) -> CGPoint? {
            guard let position = element(node, "AXPosition") as! AXValue?,
                  let size = element(node, "AXSize") as! AXValue? else { return nil }
            var origin = CGPoint.zero
            var extent = CGSize.zero
            guard AXValueGetValue(position, .cgPoint, &origin),
                  AXValueGetValue(size, .cgSize, &extent) else { return nil }
            return CGPoint(x: origin.x + extent.width / 2, y: origin.y + extent.height / 2)
          }
          func findFile(_ node: AXUIElement, depth: Int = 0) -> CGPoint? {
            guard depth <= 12 else { return nil }
            for key in ["AXTitle", "AXDescription", "AXValue"] {
              if let name = element(node, key) as? String, name.contains("Vela drag fixture") {
                if let location = point(node) { return location }
              }
            }
            for key in ["AXSelectedChildren", "AXChildren"] {
              for child in element(node, key) as? [AXUIElement] ?? [] {
                if let location = findFile(child, depth: depth + 1) { return location }
              }
            }
            return nil
          }
          func mouse(_ type: CGEventType, _ location: CGPoint) {
            CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: location,
                    mouseButton: .left)?.post(tap: .cghidEventTap)
          }
          func findPanel(excluding ids: Set<Int>) -> [String: Any]? {
            for _ in 0..<25 {
              if let panel = windows().first(where: {
                guard !ids.contains(number($0)), let rect = frame($0), rect.minY < 120,
                      (100...600).contains(rect.width), (35...560).contains(rect.height)
                else { return false }
                return ($0[kCGWindowOwnerPID as String] as? pid_t) == pid
                  || ($0[kCGWindowLayer as String] as? Int ?? 0) >= 25
              }) { return panel }
              Thread.sleep(forTimeInterval: 0.1)
            }
            return nil
          }
          func capture(_ panel: [String: Any], _ name: String) throws {
            let rect = frame(panel)!
            let crop = CGRect(x: max(0, rect.minX - 12), y: 0,
                              width: rect.width + 24, height: rect.maxY + 16).integral
            let pixels = "\(Int(crop.minX)),0,\(Int(crop.width)),\(Int(crop.height))"
            let capture = Process()
            capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            capture.arguments = ["-x", "-R", pixels, name]
            try capture.run()
            capture.waitUntilExit()
            precondition(capture.terminationStatus == 0)
          }

          let finder = NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.finder").first!
          let url = URL(fileURLWithPath: CommandLine.arguments[2])
          NSWorkspace.shared.activateFileViewerSelecting([url])
          let finderAX = AXUIElementCreateApplication(finder.processIdentifier)
          let velaAX = AXUIElementCreateApplication(pid)
          var source: CGPoint?
          var target: CGPoint?
          for _ in 0..<40 {
            if let window = element(finderAX, "AXFocusedWindow") {
              source = findFile(window as! AXUIElement)
            }
            if let extras = element(velaAX, "AXExtrasMenuBar"),
              let button = (element(extras as! AXUIElement, "AXChildren") as? [AXUIElement])?.first {
              target = point(button)
            }
            if source != nil && target != nil { break }
            Thread.sleep(forTimeInterval: 0.15)
          }
          guard let source, let target, CGPreflightPostEventAccess() else {
            print("Finder source: \(String(describing: source)), Vela target: \(String(describing: target)), CGEvent permission: \(CGPreflightPostEventAccess())")
            exit(1)
          }
          let before = Set(windows().map(number))
          mouse(.mouseMoved, source)
          mouse(.leftMouseDown, source)
          defer { mouse(.leftMouseUp, target) }
          for step in 1...24 {
            let fraction = CGFloat(step) / 24
            mouse(.leftMouseDragged, CGPoint(x: source.x + (target.x - source.x) * fraction,
                                             y: source.y + (target.y - source.y) * fraction))
            Thread.sleep(forTimeInterval: 0.04)
          }
          guard let hover = findPanel(excluding: before) else {
            print("Missing Finder drag preview at \(target)")
            exit(1)
          }
          try capture(hover, "vela-finder-hover.png")
          mouse(.leftMouseUp, target)
          guard let menu = findPanel(excluding: before.union([number(hover)])) else {
            print("Missing Vela recipient menu after Finder drop")
            exit(1)
          }
          try capture(menu, "vela-finder-drop.png")
          print("FINDER_HOVER_AND_DROP_OK")
          if receiver == 0 { exit(0) }
          let menuRect = frame(menu)!
          let row = CGPoint(x: menuRect.midX, y: menuRect.maxY - 14)
          mouse(.mouseMoved, row)
          Thread.sleep(forTimeInterval: 0.25)
          mouse(.leftMouseDown, row)
          mouse(.leftMouseUp, row)
          for _ in 0..<450 {
            if let receipt = windows().first(where: {
              guard let rect = frame($0), !before.contains(number($0)),
                    rect.minY < 120, (110...420).contains(rect.width),
                    (34...90).contains(rect.height) else { return false }
              return ($0[kCGWindowOwnerPID as String] as? pid_t) == receiver
            }), let rect = frame(receipt) {
              try capture(receipt, "vela-file-receipt.png")
              let copy = CGPoint(x: rect.maxX - 36, y: rect.midY)
              mouse(.mouseMoved, copy)
              mouse(.leftMouseDown, copy)
              mouse(.leftMouseUp, copy)
              Thread.sleep(forTimeInterval: 0.5)
              let paths = NSPasteboard.general.readObjects(
                forClasses: [NSURL.self], options: [.urlReadingFileURLsOnly: true]) as? [URL] ?? []
              guard paths.first?.lastPathComponent == url.lastPathComponent else {
                print("File receipt opened, but Copy did not put the received URL on the pasteboard")
                exit(1)
              }
              guard NSWorkspace.shared.frontmostApplication?.processIdentifier == finder.processIdentifier else {
                print("The file receipt activated Vela")
                exit(1)
              }
              print("MACOS_RECEIPT_COPY_WITHOUT_ACTIVATION_OK")
              exit(0)
            }
            Thread.sleep(forTimeInterval: 0.1)
          }
          print("No file receipt was shown by the receiving instance")
          exit(1)
          SWIFT
          defaults write -g AppleInterfaceStyleSwitchesAutomatically -bool false
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          defaults write -g AppleLanguages -array zh-Hans en
          support="$HOME/Library/Containers/com.example.vela/Data/Library/Application Support/com.example.vela"
          mkdir -p "$support"
          bundle="$PWD/Vela.app/Contents/MacOS/Vela"
          # RFC 8032 fixture identities used only by this hosted test.
          first=9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60
          second=4ccd089b28ff96da9db6c346ec114e0f5b8a319f35aba624da8cf6ed4fb8a6fb
          security add-generic-password -U -a identity_default -s Vela -A -w "$(printf '%s' "$first" | xxd -r -p | base64)"
          security add-generic-password -U -a identity_qa-sender -s Vela -A -w "$(printf '%s' "$second" | xxd -r -p | base64)"
          prefs="$HOME/Library/Containers/com.example.vela/Data/Library/Preferences"
          mkdir -p "$prefs"
          defaults write "$prefs/com.example.vela" flutter.auto_accept_default -bool true
          sqlite3 "$support/peer_state_v2.sqlite3" <<'SQL'
          CREATE TABLE peer_state (profile TEXT PRIMARY KEY, value TEXT NOT NULL);
          PRAGMA user_version = 1;
          INSERT INTO peer_state (profile, value) VALUES ('default', '{"version":2,"peers":{"3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"Sender"},"types":{"3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c":"desktop"},"aliases":{}}');
          INSERT INTO peer_state (profile, value) VALUES ('qa-sender', '{"version":2,"peers":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"Receiver"},"types":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"desktop"},"aliases":{"d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a":"工作 Mac"}}');
          SQL
          "$bundle" > receiver.log 2>&1 &
          receiver_pid=$!
          "$bundle" --device=qa-sender > vela.log 2>&1 &
          vela_pid=$!
          trap 'kill "$vela_pid" "$receiver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..35}; do
            if grep -q 'event=ready' vela.log && grep -q 'event=ready' receiver.log; then break; fi
            kill -0 "$vela_pid" "$receiver_pid"
            sleep 1
          done
          if ! grep -q 'event=ready' vela.log || ! grep -q 'event=ready' receiver.log; then
            echo 'Fixture identity access failed. Verifying just the Finder interaction with an app-generated identity.'
            kill "$vela_pid" "$receiver_pid" 2>/dev/null || true
            security delete-generic-password -a identity_default -s Vela || true
            security delete-generic-password -a identity_qa-sender -s Vela || true
            "$bundle" --device=qa-sender > fallback.log 2>&1 &
            vela_pid=$!
            receiver_pid=0
            trap 'kill "$vela_pid" 2>/dev/null || true' EXIT
            for attempt in {1..35}; do
              if grep -q 'event=ready' fallback.log; then break; fi
              kill -0 "$vela_pid"
              sleep 1
            done
            grep 'event=ready' fallback.log
          else
            grep -E 'event=ready|event=offline' vela.log receiver.log
            kill -0 "$vela_pid" "$receiver_pid"
          fi
          fixture="$RUNNER_TEMP/finder-fixture"
          mkdir "$fixture"
          printf 'Test file for Vela\n' > "$fixture/Vela drag fixture.txt"
          xcrun swift capture.swift "$vela_pid" "$fixture/Vela drag fixture.txt" "$receiver_pid"
          test -s vela-finder-hover.png && test -s vela-finder-drop.png
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vela-finder-drop
          path: |
            ${{ runner.temp }}/vela-menu/vela-*.png
            ${{ runner.temp }}/vela-menu/*.log
          if-no-files-found: warn
          retention-days: 3
