name: iOS and iPadOS preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-archive:
    name: Build iPad device archive for local signing
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
      - run: flutter pub get --enforce-lockfile
      - name: Archive for physical devices
        run: |
          flutter build ios --config-only --release --no-pub --no-codesign
          xcodebuild archive -quiet -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Vela.xcarchive" CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/Vela.xcarchive/Products/Applications/Runner.app"
          xcrun vtool -show-build "$app/Runner" | grep -E 'platform IOS$'
          ditto -c -k --keepParent "$RUNNER_TEMP/Vela.xcarchive" "$RUNNER_TEMP/Vela-iPad-device-archive.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Vela-iPad-device-archive
          path: ${{ runner.temp }}/Vela-iPad-device-archive.zip
          retention-days: 1
          if-no-files-found: error
