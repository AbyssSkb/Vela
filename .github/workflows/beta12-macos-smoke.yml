name: Beta 12 macOS installer acceptance

on:
  push:
    branches: [codex/qa-beta-12-macos]

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Install and upgrade (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_RUN: 44919505863
      CANDIDATE_COMMIT: 4f9c6dab800ab68f14a21cbdb492447a51902398
    steps:
      - name: Download previous public installer and exact candidate
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          test "$(gh run view "$RELEASE_RUN" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$CANDIDATE_COMMIT"
          mkdir previous candidate
          gh release download v0.1.0-beta.11 -R "$GITHUB_REPOSITORY" --pattern "*-macos-$TARGET_ARCH.dmg" --pattern SHA256SUMS --dir previous
          (cd previous; awk -v suffix="macos-$TARGET_ARCH.dmg" '$2 ~ suffix"$"' SHA256SUMS | shasum -a 256 -c -)
          for attempt in {1..120}; do
            if gh run download "$RELEASE_RUN" -R "$GITHUB_REPOSITORY" --name "release-macos-$TARGET_ARCH" --dir candidate; then break; fi
            status="$(gh run view "$RELEASE_RUN" -R "$GITHUB_REPOSITORY" --json status --jq .status)"
            test "$status" != completed
            sleep 10
          done
          test -f "candidate/Vela-0.1.0-beta.12-macos-$TARGET_ARCH.dmg"
      - name: Verify, install, launch, and upgrade
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          app="$RUNNER_TEMP/install/Vela.app"
          mount="$RUNNER_TEMP/vela-volume"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
            if mount | grep -F " on $mount " >/dev/null; then hdiutil detach "$mount"; fi
            for log in "$RUNNER_TEMP"/vela-*.log; do
              if [[ -f "$log" ]]; then tail -20 "$log"; fi
            done
          }
          trap cleanup EXIT
          mkdir -p "$mount" "$(dirname "$app")"
          prepare_keychain() {
            local keychain="$RUNNER_TEMP/$1.keychain-db"
            security create-keychain -p velasmoke12 "$keychain"
            security list-keychains -d user -s "$keychain"
            security default-keychain -d user -s "$keychain"
            security unlock-keychain -p velasmoke12 "$keychain"
          }
          cat > "$RUNNER_TEMP/KeychainApproval.swift" <<'SWIFT'
          import AppKit
          import Vision
          
          import ImageIO
          
          guard CommandLine.arguments.count == 2,
                let source = CGImageSourceCreateWithURL(URL(fileURLWithPath: CommandLine.arguments[1]) as CFURL, nil),
                let screenshot = CGImageSourceCreateImageAtIndex(source, 0, nil) else { exit(1) }
          let ocr = VNRecognizeTextRequest()
          ocr.recognitionLanguages = ["en-US"]
          try VNImageRequestHandler(cgImage: screenshot).perform([ocr])
          let rows = (ocr.results ?? []).compactMap { observation in
              observation.topCandidates(1).first.map { ($0.string, observation.boundingBox) }
          }
          let text = rows.map(\.0).joined(separator: " ").lowercased()
          guard text.contains("vela"), text.contains("keychain"),
                let (_, allow) = rows.first(where: { $0.0 == "Always Allow" }),
                let (_, password) = rows.first(where: { $0.0 == "Password:" }) else { exit(1) }
          print("Observed the Vela keychain access prompt.")
          guard CGPreflightPostEventAccess() else { exit(2) }
          
          let display = CGDisplayBounds(CGMainDisplayID())
          let field = CGPoint(x: (password.maxX + 0.045) * display.width,
                              y: (1 - password.midY) * display.height)
          let confirm = CGPoint(x: allow.midX * display.width,
                                y: (1 - allow.midY) * display.height)
          
          func click(_ point: CGPoint) {
              for type: CGEventType in [.leftMouseDown, .leftMouseUp] {
                  CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: point,
                          mouseButton: .left)?.post(tap: .cghidEventTap)
              }
          }
          click(field)
          Thread.sleep(forTimeInterval: 0.2)
          let keys: [CGKeyCode] = [9, 14, 37, 0, 1, 46, 31, 40, 14, 18, 19] // velasmoke12
          for key in keys {
              CGEvent(keyboardEventSource: nil, virtualKey: key, keyDown: true)?.post(tap: .cghidEventTap)
              CGEvent(keyboardEventSource: nil, virtualKey: key, keyDown: false)?.post(tap: .cghidEventTap)
          }
          Thread.sleep(forTimeInterval: 0.2)
          click(confirm)
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/KeychainApproval.swift" -o "$RUNNER_TEMP/approve-keychain"
          launch() {
            local directory="$1" version="$2" build="$3" phase="$4"
            local dmg="$directory/Vela-$version-macos-$TARGET_ARCH.dmg"
            hdiutil verify "$dmg"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
            if [[ -d "$app" ]]; then mv "$app" "$RUNNER_TEMP/previous-install.app"; fi
            ditto "$mount/Vela.app" "$app"
            hdiutil detach "$mount"
            codesign --verify --deep --strict "$app"
            local plist="$app/Contents/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = com.example.vela
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = 0.1.0
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "$build"
            local executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")"
            "$app/Contents/MacOS/$executable" >"$RUNNER_TEMP/vela-$version.log" 2>&1 &
            pid=$!
            for attempt in {1..30}; do
              kill -0 "$pid"
              if grep -q 'event=ready' "$RUNNER_TEMP/vela-$version.log"; then
                echo "$version started its receive node on $TARGET_ARCH"
                return
              fi
              if [[ "$phase" == upgrade && "$attempt" =~ ^(5|8|11)$ ]]; then
                if screencapture -x "$RUNNER_TEMP/vela-keychain.png"; then
                  "$RUNNER_TEMP/approve-keychain" "$RUNNER_TEMP/vela-keychain.png" || true
                fi
              fi
              sleep 2
            done
            return 1
          }
          prepare_keychain vela-upgrade
          launch previous 0.1.0-beta.11 16 previous
          database="$(find "$HOME/Library/Containers/com.example.vela" -name peer_state_v2.sqlite3 -print -quit)"
          test -f "$database"
          identity="$(stat -f %i "$database")"
          kill "$pid"
          wait "$pid" || true
          pid=""
          launch candidate 0.1.0-beta.12 17 upgrade
          test "$(stat -f %i "$database")" = "$identity"
          echo "Upgraded in place and reused the existing data store."
          kill "$pid"
          wait "$pid" || true
          pid=""
          mv "$app" "$RUNNER_TEMP/upgraded-install.app"
          mkdir "$RUNNER_TEMP/vela-upgrade-data"
          for file in "$database" "$database-wal" "$database-shm"; do
            if [[ -f "$file" ]]; then mv "$file" "$RUNNER_TEMP/vela-upgrade-data"; fi
          done
          prepare_keychain vela-clean
          launch candidate 0.1.0-beta.12 17 clean
          test -f "$database"
          echo "Candidate also started with a fresh data store."
